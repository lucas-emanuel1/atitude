<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auto Escola Atitude - Gerenciamento de Alunos</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <main class="app">

    <header class="topo">
      <img src="img/logo.png" alt="Auto Escola Atitude - Você na direção" class="logo">
    </header>

    <section class="hero">
      <img src="img/hero.svg" alt="Ilustração de atendimento e aulas" class="hero__img">
    </section>

    <section class="intro">
      <h1 class="intro__titulo">
        Sistema de <span>Gerenciamento de Alunos</span>
      </h1>
      <p class="intro__sub">Gerencie, edite e exclua...</p>
    </section>

    <section class="cards">

      <article class="card">
        <div class="card__conteudo">
          <h2 class="card__titulo">Cadastre alunos</h2>
          <a href="cadastro.html" class="btn">Cadastrar</a>
        </div>
        <img src="img/card-cadastrar.svg" alt="" class="card__img">
      </article>

      <article class="card">
        <div class="card__conteudo">
          <h2 class="card__titulo">Gerenciar aulas</h2>
          <a href="aulas.html" class="btn">Gerenciar</a>
        </div>
        <img src="img/card-gerenciar.svg" alt="" class="card__img">
      </article>

    </section>

    <button type="button" class="btn-sair" id="sair">Sair</button>

    <a href="painel.html" class="btn-painel">Ver painel de aulas</a>

    <a href="alunos.html" class="btn-painel">Ver lista de alunos</a>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/home.js"></script>

</body>
</html>
