<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar - Auto Escola Atitude</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/cadastro.css">
</head>
<body>

  <main class="app">
    <header class="topo">
      <img src="img/logo.png" alt="Auto Escola Atitude" class="logo">
    </header>

    <h1 class="pagina-titulo">Acesso da <span>equipe</span></h1>

    <form id="formLogin" class="form">
      <div class="campo">
        <label for="email">Email</label>
        <input type="email" id="email" autocomplete="username" required>
      </div>

      <div class="campo">
        <label for="senha">Senha</label>
        <input type="password" id="senha" autocomplete="current-password" required>
      </div>

      <button type="submit" class="btn-principal">Entrar</button>
    </form>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
